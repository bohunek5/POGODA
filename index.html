<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pogoda - Wydminy (Premium iOS Style)</title>
    <style>
        :root {
            --glass-bg: rgba(20, 30, 50, 0.4);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --bar-bg: rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background-image: radial-gradient(circle at center, #1a2a40 0%, #0a1118 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .layout { 
            display: flex; gap: 40px; align-items: center; justify-content: center; 
            width: 100%; max-width: 1200px; padding: 20px; z-index: 2; position: relative;
        }

        .phone-container {
            width: 100%; height: 100vh; max-width: 430px; position: relative;
            overflow-y: auto; overflow-x: hidden;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255,255,255,0.1);
            scrollbar-width: none;
            transition: transform 0.3s ease;
        }
        
        @media (min-width: 431px) {
            .phone-container {
                height: 850px; max-height: 90vh; border-radius: 45px; border: 12px solid #000;
                padding-top: 10px; flex-shrink: 0;
            }
        }
        .phone-container::-webkit-scrollbar { display: none; }

        /* Photographic Background Layers */
        #bg-layer-1, #bg-layer-2 {
            position: absolute; top: -10%; left: -10%; right: -10%; bottom: -10%;
            background-size: cover; background-position: center;
            z-index: 0; transition: opacity 1s ease; pointer-events: none;
            filter: brightness(0.8) contrast(1.1);
        }
        #bg-layer-1 { opacity: 1; background-image: url('https://images.unsplash.com/photo-1534088568595-a066f410cbda?q=80&w=1000'); }
        #bg-layer-2 { opacity: 0; }
        
        .bg-pan { animation: panBg 30s infinite alternate ease-in-out; }
        @keyframes panBg { from { transform: scale(1.1) translate(0, 0); } to { transform: scale(1.15) translate(-2%, 2%); } }

        /* Tsunami Image Layer */
        #tsunami-img {
            position: absolute; bottom: -120%; left: -10%; width: 120%; height: 120%;
            background: url('https://images.unsplash.com/photo-1505963953531-177b96660fb1?q=80&w=800') center top / cover;
            z-index: 4; transition: bottom 3s cubic-bezier(0.1, 0.8, 0.2, 1);
            opacity: 0.95; filter: contrast(1.2); pointer-events: none;
            box-shadow: 0 -20px 50px rgba(0,0,0,0.8);
        }
        #tsunami-img.active { bottom: -10%; }

        /* Shaking effects for extremes */
        @keyframes extremeShake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .extreme-shake { animation: extremeShake 0.2s infinite; }

        @keyframes tornadoSpin {
            0% { transform: rotate(0deg) scale(1.1); filter: blur(0px); }
            50% { transform: rotate(5deg) scale(1.2); filter: blur(2px); }
            100% { transform: rotate(-5deg) scale(1.1); filter: blur(0px); }
        }
        .tornado-spin { animation: tornadoSpin 1.5s infinite alternate ease-in-out; }

        /* Weather Particles (Rain/Snow) */
        .weather-effects { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none; overflow: hidden; }

        .raindrop {
            position: absolute; top: -50px;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.8));
            border-radius: 5px; animation: fallRain linear infinite;
        }
        @keyframes fallRain { to { transform: translate(-10vh, 110vh) rotate(10deg); } }
        
        .hurricane-rain {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.5));
            animation: fallHurricaneRain linear infinite;
        }
        @keyframes fallHurricaneRain { to { transform: translate(-120vh, 20vh) rotate(80deg); } }

        .snowflake {
            position: absolute; top: -20px; background: white; border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.8); animation: fallSnow linear infinite;
        }
        @keyframes fallSnow {
            0% { transform: translate(0, -20px) rotate(0deg); }
            50% { transform: translate(30px, 50vh) rotate(180deg); }
            100% { transform: translate(-15px, 110vh) rotate(360deg); }
        }

        .lightning-flash {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #fff; opacity: 0; z-index: 2; pointer-events: none;
        }

        /* --- CONTENT UI --- */
        .content-wrapper { position: relative; z-index: 3; padding: 55px 20px 110px 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .main-header { text-align: center; margin-bottom: 25px; text-shadow: 0 2px 15px rgba(0, 0, 0, 0.6); animation: fadeInDown 0.8s ease; }
        .location-tag { font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 2px; }
        .city { font-size: 36px; font-weight: 400; letter-spacing: 0.5px; margin-bottom: -5px; }
        .temperature { font-size: 100px; font-weight: 200; line-height: 1; margin-left: 20px; letter-spacing: -3px; text-shadow: 0 5px 25px rgba(0,0,0,0.4); }
        .condition { font-size: 21px; font-weight: 500; margin-bottom: 3px; }
        .high-low { font-size: 21px; font-weight: 500; }

        /* Premium Glass Widget */
        .glass-widget {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 18px; padding: 16px; 
            border: 0.5px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.05);
            animation: fadeInUp 0.8s backwards; transition: background 1s ease;
        }
        .glass-widget:nth-child(2) { animation-delay: 0.1s; }
        .glass-widget:nth-child(3) { animation-delay: 0.2s; }

        /* Hourly */
        .hourly-desc { font-size: 15px; font-weight: 500; line-height: 1.3; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 0.5px solid var(--glass-border); }
        .hourly-scroll { display: flex; gap: 26px; overflow-x: auto; scrollbar-width: none; padding: 5px 0; }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hour-block { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 40px; }
        .hour-time { font-size: 15px; font-weight: 600; }
        .hour-icon { height: 28px; display: flex; align-items: center; justify-content: center; }
        .hour-icon svg { width: 24px; height: 24px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.4)); }
        .hour-temp { font-size: 20px; font-weight: 500; }

        /* 10-Day */
        .ten-day-header { font-size: 13px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .ten-day-header svg { width: 14px; height: 14px; opacity: 0.7;}
        .day-row { display: flex; align-items: center; padding: 14px 0; border-bottom: 0.5px solid var(--glass-border); }
        .day-row:last-child { border-bottom: none; padding-bottom: 0; }
        .day-name { width: 50px; font-size: 20px; font-weight: 500; }
        .day-icon-col { width: 55px; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .day-icon-col svg { width: 28px; height: 28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .pop { font-size: 12px; color: #87CEFA; font-weight: 700; margin-top: 1px; }
        .day-low { width: 35px; text-align: right; font-size: 20px; font-weight: 500; color: var(--text-secondary); }
        .day-bar-container { flex: 1; margin: 0 14px; height: 5px; background: var(--bar-bg); border-radius: 3px; position: relative; }
        .day-bar-fill { position: absolute; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #99c27f, #dfb957, #e89524); transition: width 1s ease, left 1s ease;}
        .current-temp-dot { position: absolute; width: 5px; height: 5px; background: white; border-radius: 50%; top: 0; box-shadow: 0 0 0 3px #415270; z-index: 2; transition: left 1s ease;}
        .day-high { width: 35px; text-align: right; font-size: 20px; font-weight: 500; }

        /* Nav */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; height: 85px;
            background: rgba(20, 30, 50, 0.4); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-top: 0.5px solid var(--glass-border); display: flex; justify-content: space-between; align-items: flex-start;
            padding: 16px 28px; z-index: 10;
        }
        @media (min-width: 431px) { .bottom-nav { border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; } }
        .nav-icon { cursor: pointer; transition: transform 0.2s; }
        .nav-icon:hover { transform: scale(1.1); }
        .nav-icon svg { width: 30px; height: 30px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2)); }
        .page-dots { display: flex; align-items: center; gap: 7px; margin-top: 12px; }
        .dot { width: 7px; height: 7px; background: rgba(255,255,255,0.3); border-radius: 50%; }
        .dot.active { background: white; box-shadow: 0 0 8px white;}
        .nav-arrow { margin-right: 3px; }
        .nav-arrow svg { width: 14px; height: 14px; transform: rotate(-45deg); opacity: 0.9;}

        /* --- CONTROLS PANEL --- */
        .controls-wrapper { display: flex; gap: 20px; z-index: 5;}
        .controls { display: flex; flex-direction: column; gap: 12px; min-width: 260px; animation: fadeInRight 1s ease-out;}
        .controls h2 { font-size: 20px; font-weight: 300; margin-bottom: 5px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: 1px; }

        .control-btn {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px 20px; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: all 0.3s ease; box-shadow: 0 8px 25px rgba(0,0,0,0.2); text-align: left;
        }
        
        .control-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateX(10px); border-color: rgba(255, 255, 255, 0.4); }
        .control-btn.active {
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            transform: translateX(15px);
        }

        .emoji { font-size: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

        @media (max-width: 800px) {
            .layout { flex-direction: column; padding-bottom: 50px; }
            .controls-wrapper { flex-direction: column; }
            .controls { flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .controls h2 { width: 100%; text-align: center; }
            .control-btn { padding: 15px 20px; width: 45%; font-size: 15px; }
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="layout">
        <div class="phone-container" id="phone">
            
            <!-- PHOTOGRAPHIC BACKGROUND LAYERS -->
            <div id="bg-layer-1" class="bg-pan"></div>
            <div id="bg-layer-2" class="bg-pan"></div>
            
            <div id="tsunami-img"></div>
            
            <div class="weather-effects" id="weather-effects"></div>
            
            <div class="content-wrapper">
                <div class="main-header">
                    <div class="location-tag">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" style="transform: rotate(45deg);"><path d="M21 3L3 10.533L9.568 12.432L11.467 19L19 3H21Z"/></svg>
                        DOM

                </div>

                <div class="glass-widget">

                        <div class="hour-block"><div class="hour-time">Teraz</div><div class="hour-icon" id="hour-icon-1"></div><div class="hour-temp" id="hour-temp-1">19&deg;</div></div>
                        <div class="hour-block"><div class="hour-time">22</div><div class="hour-icon" id="hour-icon-2"></div><div class="hour-temp" id="hour-temp-2">19&deg;</div></div>
                        <div class="hour-block"><div class="hour-time">23</div><div class="hour-icon" id="hour-icon-3"></div><div class="hour-temp" id="hour-temp-3">18&deg;</div></div>
                        <div class="hour-block"><div class="hour-time">00</div><div class="hour-icon" id="hour-icon-4"></div><div class="hour-temp" id="hour-temp-4">17&deg;</div></div>
                        <div class="hour-block"><div class="hour-time">01</div><div class="hour-icon" id="hour-icon-5"></div><div class="hour-temp" id="hour-temp-5">17&deg;</div></div>
                        <div class="hour-block"><div class="hour-time">02</div><div class="hour-icon" id="hour-icon-6"></div><div class="hour-temp" id="hour-temp-6">16&deg;</div></div>

                </div>

                <div class="glass-widget">

                        PROGNOZA 10-DNIOWA
                    </div>
                    
                    <div class="day-row">
                        <div class="day-name">Dziś</div>
                        <div class="day-icon-col" id="day-icon-1"></div>
                        <div class="day-low" id="day-low-1">17&deg;</div>
                        <div class="day-bar-container">
                            <div class="day-bar-fill" style="left: 40%; width: 60%;" id="bar-1"></div>
                            <div class="current-temp-dot" style="left: 60%;" id="dot-1"></div>
                        </div>

                    </div>

                    <div class="day-row">
                        <div class="day-name">Pt.</div>
                        <div class="day-icon-col" id="day-icon-2">
                            <div class="pop" id="pop-1">75%</div>
                        </div>
                        <div class="day-low" id="day-low-2">15&deg;</div>
                        <div class="day-bar-container">
                            <div class="day-bar-fill" style="left: 20%; width: 50%; background: linear-gradient(90deg, #99c27f, #dfb957);" id="bar-2"></div>
                        </div>
                        <div class="day-high" id="day-high-2">21&deg;</div>
                    </div>

                    <div class="day-row">
                        <div class="day-name">Sob.</div>
                        <div class="day-icon-col" id="day-icon-3">
                            <div class="pop" id="pop-2">85%</div>
                        </div>
                        <div class="day-low" id="day-low-3">14&deg;</div>
                        <div class="day-bar-container">
                            <div class="day-bar-fill" style="left: 10%; width: 40%; background: linear-gradient(90deg, #7db37f, #99c27f);" id="bar-3"></div>

                    </div>
                </div>
            </div>

            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg></div>

        <div class="controls-wrapper">

                <button class="control-btn" onclick="setWeather('sunny', this)">
                    <span class="emoji">☀️</span> Słonecznie
                </button>
                <button class="control-btn" onclick="setWeather('rain', this)">
                    <span class="emoji">🌧️</span> Ulewa
                </button>
                <button class="control-btn" onclick="setWeather('snow', this)">
                    <span class="emoji">❄️</span> Śnieżyca
                </button>
            </div>
            
            <div class="controls">
                <h2>Ekstremalne 🌪️</h2>

                </button>
                <button class="control-btn" onclick="setWeather('wind', this)">
                    <span class="emoji">💨</span> Wicher

                </button>
                <button class="control-btn" onclick="setWeather('tsunami', this)">
                    <span class="emoji">🌊</span> Tsunami
                </button>

                </button>

    <script>
        // --- RELIABLE AUDIO FROM WIKIMEDIA COMMONS ---
        const sounds = {
            clear: new Audio('https://upload.wikimedia.org/wikipedia/commons/7/77/Waves_on_the_beach.ogg'),
            sunny: new Audio('https://upload.wikimedia.org/wikipedia/commons/7/77/Waves_on_the_beach.ogg'),
            rain: new Audio('https://upload.wikimedia.org/wikipedia/commons/4/4b/Rain_-_Sound_Effect.ogg'),
            snow: new Audio('https://upload.wikimedia.org/wikipedia/commons/1/14/Jingle_Bells_%28Kevin_MacLeod%29.ogg'),
            storm: new Audio('https://upload.wikimedia.org/wikipedia/commons/3/36/Thunderstorm.ogg'),
            wind: new Audio('https://upload.wikimedia.org/wikipedia/commons/3/39/Wind_sound.ogg'),
            hurricane: new Audio('https://upload.wikimedia.org/wikipedia/commons/3/39/Wind_sound.ogg'),
            tsunami: new Audio('https://upload.wikimedia.org/wikipedia/commons/f/ff/Water_splash.ogg'),
            tornado: new Audio('https://upload.wikimedia.org/wikipedia/commons/3/39/Wind_sound.ogg')
        };
        Object.values(sounds).forEach(a => { a.loop = true; a.volume = 0.5; });
        let currentAudio = null;

        // --- BACKGROUND URLS (Unsplash) ---
        const backgrounds = {
            clear: 'https://images.unsplash.com/photo-1534088568595-a066f410cbda?q=80&w=1000',
            sunny: 'https://images.unsplash.com/photo-1601297183305-6df142704ea2?q=80&w=1000',
            rain: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?q=80&w=1000',
            snow: 'https://images.unsplash.com/photo-1478265409131-1f65c88f965c?q=80&w=1000',
            storm: 'https://images.unsplash.com/photo-1605727216801-e27ce1d0ce30?q=80&w=1000',
            wind: 'https://images.unsplash.com/photo-1445264618000-f1e069c5920f?q=80&w=1000',
            hurricane: 'https://images.unsplash.com/photo-1527482797697-8795b05a13fe?q=80&w=1000',
            tornado: 'https://images.unsplash.com/photo-1610260477063-e3802da91a92?q=80&w=1000'
            // tsunami handled separately via the rising image div
        };

        const icons = {
            moon: `<svg viewBox="0 0 24 24" fill="white"><path d="M12.3 22.5c-5.8 0-10.5-4.7-10.5-10.5 0-4.6 3-8.6 7.4-10.1.3-.1.6.1.7.4.1.3 0 .6-.2.8-1.7 1.5-2.7 3.6-2.7 5.8 0 4.6 3.7 8.3 8.3 8.3 2.5 0 4.8-1.1 6.3-3 .2-.2.5-.3.8-.1.3.1.4.5.3.8-1.9 4.6-6 7.6-10.4 7.6z"/></svg>`,
            sun: `<svg viewBox="0 0 24 24" fill="#FFD700"><circle cx="12" cy="12" r="5"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/></svg>`,
            rain: `<svg viewBox="0 0 24 24" fill="white"><path d="M17.5 19h-11C3.5 19 1 16.5 1 13.5S3.5 8 6.5 8c.2 0 .4 0 .6.1 1.2-3 4-5.1 7.4-5.1 4.4 0 8 3.6 8 8 0 .4-.1.7-.1 1.1 2 .6 3.6 2.4 3.6 4.4 0 2.5-2 4.5-4.5 4.5z"/><path stroke="#87CEFA" stroke-width="2" stroke-linecap="round" d="M8 22l-1 3m4-3l-1 3m4-3l-1 3"/></svg>`,
            snow: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/></svg>`,
            storm: `<svg viewBox="0 0 24 24" fill="white"><path d="M17.5 17h-11C3.5 17 1 14.5 1 11.5S3.5 6 6.5 6c.2 0 .4 0 .6.1 1.2-3 4-5.1 7.4-5.1 4.4 0 8 3.6 8 8 0 .4-.1.7-.1 1.1 2 .6 3.6 2.4 3.6 4.4 0 1.9-1.2 3.5-3 4.1z"/><path fill="#FFD700" d="M13 14l-4 5h4l-2 5 6-7h-4z"/></svg>`,
            wind: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>`
        };

        const phone = document.getElementById('phone');
        const bg1 = document.getElementById('bg-layer-1');
        const bg2 = document.getElementById('bg-layer-2');
        const effectContainer = document.getElementById('weather-effects');
        const tsunamiImg = document.getElementById('tsunami-img');
        
        let currentBgLayer = 1;
        let lightningInterval = null;

        function changeBackground(url) {
            if (currentBgLayer === 1) {
                bg2.style.backgroundImage = `url('${url}')`;
                bg2.style.opacity = 1;
                bg1.style.opacity = 0;
                currentBgLayer = 2;
            } else {
                bg1.style.backgroundImage = `url('${url}')`;
                bg1.style.opacity = 1;
                bg2.style.opacity = 0;
                currentBgLayer = 1;
            }
        }

        function animateNumber(obj, targetValue) {
            let startValue = parseInt(obj.innerHTML);
            if(isNaN(startValue)) return;
            const duration = 1200;
            const startTime = performance.now();
            function step(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 4);
                obj.innerHTML = Math.floor(startValue + (targetValue - startValue) * ease) + '&deg;';
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function setWeather(type, btnElement) {
            // Setup Audio
            if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
            currentAudio = sounds[type];
            if (currentAudio) {
                if (type === 'hurricane' || type === 'tornado') currentAudio.volume = 1.0;
                else currentAudio.volume = 0.5;
                currentAudio.play().catch(e => console.warn("Audio blocked:", e));
            }

            // Buttons
            document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            // Reset effects
            effectContainer.innerHTML = '';
            if(lightningInterval) clearInterval(lightningInterval);
            phone.classList.remove('extreme-shake');
            bg1.classList.remove('tornado-spin');
            bg2.classList.remove('tornado-spin');
            tsunamiImg.classList.remove('active');

            // Set Photo BG
            if(backgrounds[type]) {
                changeBackground(backgrounds[type]);
            } else if (type === 'tsunami') {
                // Tsunami keeps dark bg, shows wave
                changeBackground(backgrounds.hurricane);
                tsunamiImg.classList.add('active');
            }

            // Dynamic logic
            if (type === 'clear') {
                animateNumber(document.getElementById('temp-display'), 19);
                document.getElementById('cond-display').textContent = 'Głównie bez chmur';
                updateHourly([19, 19, 18, 17, 17, 16], 'moon');
            } 
            else if (type === 'sunny') {
                animateNumber(document.getElementById('temp-display'), 28);
                document.getElementById('cond-display').textContent = 'Słonecznie';
                updateHourly([28, 29, 31, 32, 31, 28], 'sun');
            }
            else if (type === 'rain') {
                createRain(150);
                animateNumber(document.getElementById('temp-display'), 14);
                document.getElementById('cond-display').textContent = 'Ulewa';
                updateHourly([14, 14, 13, 13, 12, 12], 'rain');
            } 
            else if (type === 'snow') {
                createSnow(100);
                animateNumber(document.getElementById('temp-display'), -3);
                document.getElementById('cond-display').textContent = 'Śnieżyca';
                updateHourly([-3, -4, -5, -6, -6, -7], 'snow');
            }
            else if (type === 'storm') {
                createRain(250);
                lightningInterval = setInterval(createLightning, 3500);
                animateNumber(document.getElementById('temp-display'), 16);
                document.getElementById('cond-display').textContent = 'Burza z piorunami';
                updateHourly([16, 15, 15, 16, 17, 17], 'storm');
            }
            else if (type === 'wind') {
                animateNumber(document.getElementById('temp-display'), 12);
                document.getElementById('cond-display').textContent = 'Porywisty wiatr';
                updateHourly([12, 11, 10, 10, 9, 9], 'wind');
            }
            else if (type === 'hurricane') {
                createRain(300, 'hurricane-rain');
                phone.classList.add('extreme-shake');
                animateNumber(document.getElementById('temp-display'), 18);
                document.getElementById('cond-display').textContent = 'Huragan Kategoria 5';
                updateHourly([18, 17, 17, 16, 16, 15], 'storm');
            }
            else if (type === 'tsunami') {
                phone.classList.add('extreme-shake'); // Shake while wave comes
                animateNumber(document.getElementById('temp-display'), 22);
                document.getElementById('cond-display').textContent = 'Zagrożenie Tsunami';
                updateHourly([22, 21, 21, 20, 20, 19], 'rain');
            }
            else if (type === 'tornado') {
                bg1.classList.add('tornado-spin');
                bg2.classList.add('tornado-spin');
                phone.classList.add('extreme-shake');
                animateNumber(document.getElementById('temp-display'), 25);
                document.getElementById('cond-display').textContent = 'Tornado';
                updateHourly([25, 24, 22, 21, 20, 19], 'wind');
            }
        }

        // Particle generators
        function createRain(amount, extraClass = '') {
            for (let i = 0; i < amount; i++) {
                let drop = document.createElement('div');
                drop.className = 'raindrop ' + extraClass;
                drop.style.left = (Math.random() * 150 - 20) + '%'; 
                drop.style.animationDelay = (Math.random() * 2) + 's';
                drop.style.animationDuration = (Math.random() * 0.2 + 0.2) + 's';
                let depth = Math.random(); 
                if (depth > 0.8) { drop.style.width = '3px'; drop.style.height = '60px'; drop.style.opacity = '0.7'; } 
                else if (depth > 0.4) { drop.style.width = '2px'; drop.style.height = '40px'; drop.style.opacity = '0.4'; } 
                else { drop.style.width = '1px'; drop.style.height = '20px'; drop.style.opacity = '0.2'; }
                effectContainer.appendChild(drop);
            }
        }

        function createSnow(amount) {
            for (let i = 0; i < amount; i++) {
                let flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.style.left = (Math.random() * 100) + '%';
                let size = Math.random() * 6 + 2; 
                flake.style.width = size + 'px'; flake.style.height = size + 'px';
                flake.style.animationDelay = (Math.random() * 5) + 's';
                flake.style.animationDuration = (Math.random() * 3 + 3) + 's';
                flake.style.opacity = Math.random() * 0.6 + 0.4;
                effectContainer.appendChild(flake);
            }
        }

        function createLightning() {
            let flash = document.createElement('div');
            flash.className = 'lightning-flash';
            effectContainer.appendChild(flash);
            setTimeout(() => flash.style.opacity = '0.8', 50);
            setTimeout(() => flash.style.opacity = '0', 100);
            setTimeout(() => flash.style.opacity = '0.9', 150);
            setTimeout(() => flash.style.opacity = '0', 200);
            setTimeout(() => flash.remove(), 400);
        }

        function updateHourly(temps, iconType) {
            for(let i = 1; i <= 6; i++) {
                let tempEl = document.getElementById('hour-temp-' + i);
                if(tempEl) animateNumber(tempEl, temps[i-1]);
                let iconContainer = document.getElementById('hour-icon-' + i);
                iconContainer.innerHTML = icons[iconType] || icons.moon;
            }
            let bases = temps[0];
            animateNumber(document.getElementById('day-low-1'), bases - 2);
            animateNumber(document.getElementById('day-high-1'), bases + 5);
            for(let i=1; i<=3; i++) {
                let el = document.getElementById('day-icon-'+i);
                if(el) {
                    let pop = el.querySelector('.pop');
                    el.innerHTML = (icons[iconType] || icons.moon);
                    if(pop) el.appendChild(pop);
                }
            }
        }

        // Init
        for(let i=1; i<=6; i++) document.getElementById('hour-icon-'+i).innerHTML = icons.moon;
        for(let i=1; i<=3; i++) {
            let el = document.getElementById('day-icon-'+i);
            if(el) { let pop = el.innerHTML; el.innerHTML = icons.moon + pop; }
        }
    </script>
</body>
</html>
